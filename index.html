<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><script>(function(){var H="55f436ffd5f96390fa89b871cc471f8bff235d3e0d876ac71cd07b5973fe2e3b";if(sessionStorage.getItem("dg")===H)return;var v=prompt("請輸入密碼（簡易保護，非真正安全）");crypto.subtle.digest("SHA-256",new TextEncoder().encode(v||"")).then(function(b){var h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");if(h===H){sessionStorage.setItem("dg",h)}else{document.documentElement.innerHTML="<p style=font-family:sans-serif;padding:24px>密碼錯誤，請重新整理。</p>"}})})();</script><title>Dopi Note 行銷管理台</title>
<style>body{font-family:system-ui,"Noto Sans TC",sans-serif;margin:0;background:#f6f7f9;color:#222}header{background:#4f46e5;color:#fff;padding:16px 24px}main{max-width:1100px;margin:auto;padding:16px}section{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0001}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #eee;padding:6px;text-align:left;vertical-align:top}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{flex:1;min-width:120px;background:#eef;border-radius:8px;padding:12px;text-align:center}.card b{font-size:24px;display:block}.item{border:1px solid #e5e5e5;border-radius:8px;padding:12px;margin:10px 0}pre{white-space:pre-wrap;font-family:inherit;background:#fafafa;padding:8px;border-radius:6px}textarea{width:100%;min-height:120px}button{margin-right:6px;padding:6px 12px;border:0;border-radius:6px;cursor:pointer}.ok{background:#16a34a;color:#fff}.no{background:#dc2626;color:#fff}.ed{background:#e5e7eb}.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:#eee}</style></head><body>
<div style="background:#fef3c7;color:#92400e;padding:10px 24px;font-weight:600">⚠️ 審核已移到 Notion「待審核內容」資料庫（唯一依據）。本頁僅供參考，在這裡按核准不會生效。</div><header><h2 style="margin:0">Dopi Note 行銷管理台</h2><small><a style="color:#fff" href="reddit-plan.md" target=_blank>📄 Reddit 計畫</a> · <a style="color:#fff" href="setup-kit.md" target=_blank>🧰 X／Threads 開帳號包</a> · 所有貼文與留言需經 YJ 核准才會發布 · 零預算</small></header><main>
<section><h3>總覽</h3><div class="cards" id="sum"></div></section>
<section><h3>內容審核佇列</h3><select id="f" onchange="render()"><option value="">全部</option><option>待審核</option><option>已核准</option><option>已退回</option><option>已發布</option></select> <button class="ed" onclick="exp()">匯出 JSON</button> <button class="ed" onclick="if(confirm('重設為初始資料？')){localStorage.removeItem('dq');load()}">重設</button><div id="q"></div></section>
<section><h3>團隊人設（皆公開揭露身分）</h3><ul id="pr" style="font-size:13px"></ul><div class="cards" id="ps"></div></section>
<section><h3>渠道策略</h3><table id="ch"></table></section>
<section><h3>帳號清單</h3><table id="ac"></table></section></main>
<script>
let D,Q;const e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){D=await (await fetch('data.json?'+Date.now())).json();const L=JSON.parse(localStorage.getItem('dq')||'null');Q=D.queue.map(x=>{const o=(L||[]).find(y=>y.id==x.id);return o?{...x,status:o.status,note:o.note,text:o.text}:x});render()}
function save(){localStorage.setItem('dq',JSON.stringify(Q));render()}
function set(i,s){const it=Q.find(x=>x.id==i);if(s=='已退回'){it.note=prompt('退回原因（可留空）')||''}it.status=s;save()}
function edit(i){const it=Q.find(x=>x.id==i);document.getElementById('t'+i).outerHTML=`<textarea id="ta${i}">${e(it.text)}</textarea><button class="ok" onclick="sv(${i})">儲存</button>`}
function sv(i){Q.find(x=>x.id==i).text=document.getElementById('ta'+i).value;save()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...D,queue:Q},null,2)],{type:'application/json'}));a.download='dopi-queue.json';a.click()}
function render(){const st=['待審核','已核准','已退回','已發布'];
sum.innerHTML=st.map(s=>`<div class="card"><b>${Q.filter(x=>x.status==s).length}</b>${s}</div>`).join('')+`<div class="card"><b>${D.channels.length}</b>渠道</div>`;
const f=document.getElementById('f').value;
q.innerHTML=Q.filter(x=>!f||x.status==f).map(x=>`<div class="item"><span class="tag">${e(x.status)}</span> <b>${e(x.channel)}</b> · ${e(x.type)} ${x.schedule?' · <span class="tag" style="background:#dbeafe">📅 '+e(x.schedule)+'</span>':''} ${x.persona?' · 👤 '+e(((D.personas||[]).find(p=>p.id==x.persona)||{nickname:x.persona=='brand'?'品牌官方帳號':x.persona}).nickname):''} · 目標：${/^https?:/.test(x.target)?'<a target=_blank href="'+e(x.target)+'">'+e(x.target)+'</a>':e(x.target)}${x.context?'<div style="font-size:13px;background:#fffbe6;padding:6px;border-radius:6px;margin-top:6px"><b>原文脈絡：</b>'+e(x.context)+'<br><b>版規／注意：</b>'+e(x.rules||'')+(x.backups?'<br><b>備選：</b>'+x.backups.map(e).join('<br>'):'')+'</div>':''}<pre id="t${x.id}">${e(x.text)}</pre>${x.note?'<small>退回原因：'+e(x.note)+'</small><br>':''}<button class="ok" onclick="set(${x.id},'已核准')">核准</button><button class="no" onclick="set(${x.id},'已退回')">退回</button><button class="ed" onclick="edit(${x.id})">編輯</button><button class="ed" onclick="set(${x.id},'已發布')">標記已發布</button></div>`).join('');
ch.innerHTML='<tr><th>地區</th><th>渠道</th><th>原因</th><th>受眾</th><th>規則/風險</th><th>頻率</th><th>帳號</th></tr>'+D.channels.map(c=>`<tr><td>${e(c.region)}</td><td>${e(c.name)}</td><td>${e(c.why)}</td><td>${e(c.fit)}</td><td>${e(c.risk)}</td><td>${e(c.cadence)}</td><td>${e(c.account)}</td></tr>`).join('');
pr.innerHTML=(D.personaRules||[]).map(r=>'<li>'+e(r)+'</li>').join('');ps.innerHTML=(D.personas||[]).map(p=>`<div class="card" style="text-align:left;min-width:280px;background:#f5f3ff"><b style="font-size:16px">${e(p.nickname)}</b><small>${e(p.channel)} · ${e(p.handle)} · 負責：${e(p.bot)}</small><p><i>${e(p.bio)}</i></p><p>${e(p.backstory)}</p><p><b>語氣：</b>${e(p.voice)}</p><p><b>主題：</b>${p.topics.map(e).join('、')}</p><pre>${e(p.sample)}</pre></div>`).join('');
ac.innerHTML='<tr><th>平台</th><th>帳號</th><th>狀態</th></tr>'+D.accounts.map(a=>`<tr><td>${e(a.platform)}</td><td>${e(a.handle)}</td><td>${e(a.status)}</td></tr>`).join('')}
load()</script></body></html>
